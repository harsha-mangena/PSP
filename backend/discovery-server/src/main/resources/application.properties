spring.application.name=discovery-server
server.port=8761

# The registry does not register with, or fetch from, itself.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Self-preservation stops Eureka evicting instances when heartbeats dip, which
# is right in production but hides stopped services during local development.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
