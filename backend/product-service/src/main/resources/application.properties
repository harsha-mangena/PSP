spring.application.name=product-service
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=productdb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Str0ng!Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# The producer omits type headers, so the target type is declared here.
spring.kafka.consumer.properties.spring.json.value.default.type=com.enterprise.product.event.CartEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.enterprise.product.event

app.kafka.cart-events-topic=cart-events
app.kafka.order-events-topic=order-events

# CORS is owned by the API gateway. Applying it here too made responses carry
# duplicate Access-Control-Allow-Origin headers, which browsers reject.

# Eureka registration. Short intervals keep local start-up responsive; the
# defaults (30s) make a restarted service look missing for far too long.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
eureka.client.registry-fetch-interval-seconds=5

# Shared secret proving a request came through the gateway (or a trusted peer
# service). Override in real deployments via APP_SECURITY_INTERNAL_SECRET.
app.security.internal-secret=${APP_SECURITY_INTERNAL_SECRET:s3cr3t-internal-gateway-key}
