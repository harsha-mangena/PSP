spring.application.name=product-service
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=productdb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Str0ng!Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# The producer omits type headers, so the target type is declared here.
spring.kafka.consumer.properties.spring.json.value.default.type=com.enterprise.product.event.CartEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.enterprise.product.event

app.kafka.cart-events-topic=cart-events
