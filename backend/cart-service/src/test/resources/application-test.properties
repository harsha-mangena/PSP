# Test profile: the context test must boot without Docker, so it uses an
# in-memory database and never connects to Kafka.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Bean wiring is still validated; the listeners just never dial out.
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
