spring.application.name=cart-service
server.port=8082

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cartdb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Str0ng!Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# cart-service calls product-service via WebClient
product.service.base-url=http://localhost:8081

# WebFlux is on the classpath for WebClient only; Tomcat stays the web server.
spring.main.web-application-type=servlet

# Kafka producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all

app.kafka.cart-events-topic=cart-events
app.kafka.order-events-topic=order-events

# CORS is owned by the API gateway. Applying it here too made responses carry
# duplicate Access-Control-Allow-Origin headers, which browsers reject.

# Demo login. Gates the UI only - the REST endpoints are NOT protected.
# Kept in configuration rather than source so it can be overridden per environment;
# override with APP_AUTH_USERNAME / APP_AUTH_PASSWORD env vars.
app.auth.username=root
app.auth.password=root1234

# Eureka registration. Short intervals keep local start-up responsive; the
# defaults (30s) make a restarted service look missing for far too long.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
eureka.client.registry-fetch-interval-seconds=5
