services:
  # Azure SQL Edge is the ARM64-native build of the SQL Server engine. It speaks
  # the same TDS protocol, so the mssql-jdbc driver and SQLServerDialect are
  # unchanged. The amd64 mssql/server:2022 image segfaults (exit 139) under
  # Rosetta emulation on Apple Silicon.
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: psp-sqlserver
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqledge-data:/var/opt/mssql

  kafka:
    image: apache/kafka:3.9.0
    container_name: psp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OTk5MzhFRjA0NDVBQg"

volumes:
  sqledge-data:
